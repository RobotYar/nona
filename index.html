<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nona - AI Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        /* === 1. ОБЩИЕ НАСТРОЙКИ === */
        :root {
            --bg-color: #121212; /* Глубокий серый/черный */
            --accent-color: #dd8f9f; /* Твой розовый акцент */
            --text-color: #e0e0e0;
            --panel-bg: rgba(30, 30, 30, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial', sans-serif; /* Гротеск без засечек */
            overflow: hidden; /* Запрещаем скролл страницы */
            width: 100vw;
            height: 100vh;
        }

        button, input, select { font-family: inherit; }

        /* === 2. ЛОББИ === */
        #lobby-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            overflow-y: auto;
        }

        .info-card {
            background: #1e1e1e;
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(221, 143, 159, 0.1);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            margin-bottom: 15px;
            background-color: #333; /* Заглушка, если фото не загрузится */
        }

        .description { font-size: 14px; margin-bottom: 20px; line-height: 1.4; color: #aaa; }
        .author-tag { font-size: 12px; color: var(--accent-color); margin-bottom: 20px; display: block;}

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .form-control {
            width: 100%; padding: 10px;
            background: #2a2a2a; color: #fff;
            border: 1px solid #444; border-radius: 6px; outline: none;
        }
        .form-control:focus { border-color: var(--accent-color); }

        .join-btn {
            width: 100%; padding: 12px; margin-top: 10px;
            background: var(--accent-color); color: #000;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
            transition: opacity 0.2s;
        }
        .join-btn:active { opacity: 0.8; }

        .timer-container { margin-top: 15px; width: 100%; }
        .timer-text { font-size: 12px; color: #888; margin-bottom: 5px; }
        .timer-bar-bg { width: 100%; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
        .timer-bar-fill { height: 100%; background: var(--accent-color); width: 100%; transition: width 1s linear; }

        /* === 3. ОСНОВНАЯ КОМНАТА === */
        #room-page {
            display: none; /* Скрыто по умолчанию */
            width: 100%; height: 100%; position: relative;
        }

        /* Видео на весь экран */
        #video-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; background-color: #000;
        }

        /* Нижняя панель */
        .control-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            background: var(--panel-bg); backdrop-filter: blur(10px);
            padding: 12px; border-radius: 16px; width: 95%; max-width: 600px;
        }

        .ctrl-btn {
            background: transparent; color: var(--text-color);
            border: 1px solid #555; border-radius: 8px;
            padding: 10px 15px; font-size: 14px; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 5px;
        }
        
        .ctrl-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }
        .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #333; }
        .ctrl-btn.danger { border-color: #666; } /* Кнопка выхода без красного */
        .ctrl-btn.danger:active { background: #444; }

        /* Анимация уведомления для кнопки чата */
        @keyframes pulse-alert {
            0% { box-shadow: 0 0 0 0 rgba(221, 143, 159, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(221, 143, 159, 0); }
            100% { box-shadow: 0 0 0 0 rgba(221, 143, 159, 0); }
        }
        
        .ctrl-btn.notify {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            animation: pulse-alert 1.5s infinite;
        }

        /* === 4. ОВЕРЛЕЙ ЧАТА === */
        #chat-overlay {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(18, 18, 18, 0.7); /* 70% непрозрачности */
            backdrop-filter: blur(4px); z-index: 20;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(221, 143, 159, 0.3);
        }
        .close-chat-btn { background: none; border: none; color: var(--accent-color); font-size: 24px; cursor: pointer; }

        .chat-timeline {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }

        .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .msg.human { background: rgba(255, 255, 255, 0.1); align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.ai { background: rgba(221, 143, 159, 0.2); border: 1px solid rgba(221, 143, 159, 0.3); align-self: flex-start; border-bottom-left-radius: 2px; color: #fff;}
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; border: 1px solid var(--accent-color); }
    </style>
</head>
<body>

    <div id="lobby-page">
        <div class="info-card">
            <img src="img/aira.jpg" alt="Айра Сиратори" class="avatar">
            <h2>Nona</h2>
            <span class="author-tag">by RobotYar</span>
            <p class="description">Умная девочка-иитуберша. Твой персональный ассистент в нейробиологии, искусственном интеллекте и программировании.</p>
            
            <div style="font-size: 12px; color: var(--accent-color); margin-bottom: 15px;">
                👥 Людей в комнате: <span id="room-count">1</span>
            </div>

            <div class="form-group">
                <label>Твое имя</label>
                <input type="text" id="username" class="form-control" placeholder="Например, Жека">
            </div>

            <div class="form-group">
                <label>Камера</label>
                <select id="camera-select" class="form-control"><option>Загрузка...</option></select>
            </div>

            <div class="form-group">
                <label>Микрофон</label>
                <select id="mic-select" class="form-control"><option>Загрузка...</option></select>
            </div>

            <div class="form-group">
                <label>Динамик / Наушники</label>
                <select id="speaker-select" class="form-control"><option>Загрузка...</option></select>
            </div>

            <div class="timer-container">
                <div class="timer-text" id="timer-text">Авто-вход через 10 сек...</div>
                <div class="timer-bar-bg"><div class="timer-bar-fill" id="timer-bar"></div></div>
            </div>

            <button class="join-btn" onclick="joinRoom()">ВХОД В СИСТЕМУ</button>
        </div>
    </div>

<div id="room-page">
        <video id="video-background" autoplay playsinline muted></video>
        
        <canvas id="freeze-frame" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; pointer-events: none;"></canvas>
        <div id="chat-overlay">
            <div class="chat-header">
                <h3 style="color: var(--accent-color);">Единый Журнал</h3>
                <button class="close-chat-btn" onclick="toggleChat()">✖</button>
            </div>
            <div class="chat-timeline" id="chat-timeline"></div>
        </div>

        <div class="control-panel">
            <button class="ctrl-btn danger" onclick="leaveRoom()">[X] Выход</button>
            <button class="ctrl-btn active" id="btn-mic" onclick="toggleMic()">[М] Микр</button>
            <button class="ctrl-btn active" id="btn-cam" onclick="toggleCam()">[К] Кам</button>
            <button class="ctrl-btn" id="btn-switch-cam" disabled>[Р] Смена Кам</button>
            <button class="ctrl-btn" onclick="requestTelemetry()">[Т] Телем</button> 
            <button class="ctrl-btn" onclick="takePhoto()">[Ф] Фото</button>
            <button class="ctrl-btn" id="btn-zoom" onclick="zoomIn()">[З] Зум 1x</button>
            <button class="ctrl-btn" id="btn-chat" onclick="toggleChat()">[Ч] Чат</button>
        </div>
    </div>

    <script>
        // --- Логика Лобби ---
        let countdown = 10;
        let timerInterval;

        // Рандомайзер имени при старте страницы
        function generateRandomName() {
            const input = document.getElementById('username');
            if (!input.value) {
                input.value = `Guest_${Math.floor(1000 + Math.random() * 9000)}`;
            }
        }

        function startTimer() {
            const bar = document.getElementById('timer-bar');
            const text = document.getElementById('timer-text');
            timerInterval = setInterval(() => {
                countdown--;
                bar.style.width = (countdown * 10) + '%';
                text.innerText = `Авто-вход через ${countdown} сек...`;
                if(countdown <= 0) {
                    clearInterval(timerInterval);
                    joinRoom();
                }
            }, 1000);
        }

        // Определение устройств (работает СТРОГО на https://)
        async function loadDevices() {
            try {
                // 1. Пытаемся получить и звук, и видео
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                } catch (e) {
                    console.warn("Камера не найдена, запрашиваем только микрофон...");
                    // Если камеры нет, запрашиваем только микрофон!
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                }
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                
                const camSelect = document.getElementById('camera-select');
                const micSelect = document.getElementById('mic-select');
                const speakerSelect = document.getElementById('speaker-select');
                
                camSelect.innerHTML = ''; 
                micSelect.innerHTML = ''; 
                speakerSelect.innerHTML = '';
                
                let videoCount = 0;

                devices.forEach(device => {
                    // ... (оставь внутренности цикла как есть, они правильные)
                    if (device.kind === 'videoinput') {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Камера ${videoCount + 1}`;
                        camSelect.appendChild(option);
                        videoCount++;
                    } else if (device.kind === 'audioinput') {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Микрофон ${micSelect.length + 1}`;
                        micSelect.appendChild(option);
                    } else if (device.kind === 'audiooutput') {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Динамик ${speakerSelect.length + 1}`;
                        speakerSelect.appendChild(option);
                    }
                });

                if(videoCount > 1) {
                    const switchBtn = document.getElementById('btn-switch-cam');
                    switchBtn.disabled = false;
                    switchBtn.classList.add('active');
                }

            } catch (e) {
                console.log("Доступ к устройствам категорически заблокирован", e);
                document.getElementById('camera-select').innerHTML = '<option>Нет доступа</option>';
                document.getElementById('mic-select').innerHTML = '<option>Нет доступа</option>';
                document.getElementById('speaker-select').innerHTML = '<option>Нет доступа</option>';
            }
        }

        // Запускаем при загрузке страницы
        window.onload = () => {
            generateRandomName(); // Сразу даем имя, если человек не успеет ввести свое
            loadDevices();
            startTimer();
        };

        // --- 1. НАСТРОЙКИ LIVEKIT ---
        // Адрес твоего облака (берем из твоего generative_link.bat)
        const LIVEKIT_URL = "wss://nona-mye78mpt.livekit.cloud"; 
        
        // УМНЫЙ АВТОПОДХВАТ ТОКЕНА ИЗ ССЫЛКИ
        const urlParams = new URLSearchParams(window.location.search);
        const TOKEN = urlParams.get('token');

        // ЕСЛИ ТОКЕНА НЕТ (просто открыли сайт без ссылки от бота), 
        // ВЫДАЕМ ОШИБКУ ИЛИ ПРОСИМ ВОЙТИ ЧЕРЕЗ БОТА
        if (!TOKEN) {
            console.error("Токен не найден! Используйте ссылку от Telegram-бота.");
        }

        let room; // Глобальная переменная для хранения текущей сессии

        let photoBuffer = "";
        let currentPhotoId = "";

        // --- Переходы между страницами и логика связи ---
        async function joinRoom() {
            // Полностью останавливаем и уничтожаем таймер
            clearInterval(timerInterval);
            timerInterval = null; 
            
            const bar = document.getElementById('timer-bar');
            if (bar) bar.style.width = '0%';
            
            document.getElementById('lobby-page').style.display = 'none';
            document.getElementById('room-page').style.display = 'block';
            
            const username = document.getElementById('username').value;
            addMessageToTimeline(`Система: Инициализация протокола для ${username}...`, "ai");

            try {
                // 0. Запоминаем точный выбор пользователя из выпадающих списков лобби
                const selectedMic = document.getElementById('mic-select').value;
                const selectedCam = document.getElementById('camera-select').value;
                const selectedSpeaker = document.getElementById('speaker-select').value;

                // 1. Создаем объект комнаты
                room = new LivekitClient.Room({
                    adaptiveStream: false,
                    dynacast: true,
                });

                // 2. Обработчик: ТЕКСТОВЫЙ ЧАТ, ТЕЛЕМЕТРИЯ И ФОТО (DataChannel)
                room.on(LivekitClient.RoomEvent.DataReceived, (payload, participant) => {
                    const strData = new TextDecoder().decode(payload);
                    try {
                        const msg = JSON.parse(strData);
                        
                        // --- ЛОГИКА СБОРКИ ФОТОГРАФИИ ---
                        if (msg.cmd === "photo_chunk") {
                            // Если это новый файл, очищаем буфер
                            if (currentPhotoId !== msg.file_id) {
                                currentPhotoId = msg.file_id;
                                photoBuffer = "";
                            }
                            
                            // Добавляем пришедший кусок base64 в буфер
                            photoBuffer += msg.data;
                            
                            // Если это последний кусок — собираем и показываем картинку!
                            if (msg.chunk_index === msg.total_chunks - 1) {
                                const finalImageUrl = "data:image/jpeg;base64," + photoBuffer;
                                addMessageToTimeline("Снимок получен (2K):", "ai", finalImageUrl);
                                
                                // Сбрасываем буфер
                                photoBuffer = "";
                                currentPhotoId = "";
                                
                                // Уведомляем пользователя пульсацией кнопки чата
                                const chat = document.getElementById('chat-overlay');
                                if (chat.style.display !== 'flex') {
                                    document.getElementById('btn-chat').classList.add('notify');
                                }
                            }
                            return; // Прерываем дальнейшую обработку, чтобы куски не лезли в текстовый чат
                        }

                        // --- ЛОГИКА ТЕЛЕМЕТРИИ ---
                        if (msg.type === "telemetry_response") {
                            const t = msg.data;
                            let text = `📊 Телеметрия (Аптайм: ${t.uptime_sec}с):\n`;
                            text += `🌡 CPU: ${t.cpu_temp_c}°C (Нагрузка: ${t.cpu_usage_percent}%)\n`;
                            text += `💾 ОЗУ: ${t.ram_usage.used_mb}MB / ${t.ram_usage.total_mb}MB\n`;
                            text += `💽 Диск: ${t.disk.free_gb}GB свободно\n`;
                            text += `📶 WiFi: ${t.wifi_signal} | IP: ${t.ip_address}\n`;
                            text += `🌐 Сеть: Вх ${t.network_speed.download_mbps} / Исх ${t.network_speed.upload_mbps} Mbps`;
                            
                            addMessageToTimeline(text, "ai");
                        } 
                        // --- ЛОГИКА ЧАТА ---
                        else if (msg.type === "chat" || msg.text) {
                            addMessageToTimeline(msg.text, msg.sender || "ai");
                        }

                        // Подсвечиваем кнопку чата при новом сообщении
                        const chat = document.getElementById('chat-overlay');
                        if (chat.style.display !== 'flex') {
                            document.getElementById('btn-chat').classList.add('notify');
                        }
                    } catch(e) {
                        console.log("Получены сырые текстовые данные:", strData);
                    }
                });

                // 3. Обработчик: ПОЛУЧЕНИЕ ПОТОКОВ (ВИДЕО И ЗВУК)
                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === LivekitClient.Track.Kind.Video) {
                        console.log("Ура! Получено видео от:", participant.identity);
                        const videoElement = document.getElementById('video-background');
                        track.attach(videoElement); 
                        
                        // Ждем 2.5 секунды, пока сенсор Малинки настроит фокус и свет!
                        setTimeout(() => {
                            const canvas = document.getElementById('freeze-frame');
                            canvas.style.transition = "opacity 0.8s ease-in-out"; // Плавный кроссфейд
                            canvas.style.opacity = "0"; // Растворяем Canvas
                            
                            // Когда Canvas стал прозрачным, убираем его в display: none
                            setTimeout(() => {
                                canvas.style.display = "none";
                                canvas.style.transform = "scale(1.0)";
                            }, 800); 
                        }, 2500); 
                    }
                    else if (track.kind === LivekitClient.Track.Kind.Audio) {
                        console.log("Ура! Получен звук от:", participant.identity);
                        
                        // ХАРДКОРНОЕ ПЕРЕНАПРАВЛЕНИЕ ЗВУКА НА УРОВНЕ ЭЛЕМЕНТА
                        const audioElement = document.createElement('audio');
                        audioElement.autoplay = true;
                        document.body.appendChild(audioElement);
                        track.attach(audioElement);
                        
                        if (selectedSpeaker && selectedSpeaker !== "Загрузка..." && typeof audioElement.setSinkId === 'function') {
                            audioElement.setSinkId(selectedSpeaker)
                                .then(() => console.log("[+] Поток перенаправлен на устройство:", selectedSpeaker))
                                .catch(e => console.warn("[-] Ошибка SinkId элемента:", e));
                        }
                    }
                });

                room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                    // track.detach();
                });

                // 4. КОННЕКТ К ОБЛАКУ
                await room.connect(LIVEKIT_URL, TOKEN);
                console.log("Успешное подключение к LiveKit Cloud!");
                addMessageToTimeline("Связь с облаком установлена!", "ai");

                // 5. БЕЗОПАСНОЕ ПЕРЕКЛЮЧЕНИЕ УСТРОЙСТВ (С ЗАЩИТОЙ ДЛЯ ТЕЛЕФОНОВ)
                if (selectedMic && selectedMic !== "Загрузка...") {
                    try { await room.switchActiveDevice('audioinput', selectedMic); } catch(e) {}
                }
                if (selectedCam && selectedCam !== "Загрузка...") {
                    try { await room.switchActiveDevice('videoinput', selectedCam); } catch(e) {}
                }
                if (selectedSpeaker && selectedSpeaker !== "Загрузка...") {
                    try { 
                        await room.switchActiveDevice('audiooutput', selectedSpeaker); 
                    } catch(e) { 
                        console.warn("Телефон не поддерживает смену динамика, используем системный."); 
                    }
                }
                // 6. БЕЗОПАСНАЯ ПУБЛИКАЦИЯ СВОИХ ТРЕКОВ
                if (document.getElementById('btn-mic').classList.contains('active')) {
                    try {
                        await room.localParticipant.setMicrophoneEnabled(true);
                        console.log("[+] Мой микрофон опубликован");
                    } catch(micError) {
                        console.warn("[-] Микрофон занят или не найден:", micError);
                        addMessageToTimeline("Система: Микрофон не обнаружен.", "ai");
                    }
                }

                if (document.getElementById('btn-cam').classList.contains('active')) {
                    try {
                        await room.localParticipant.setCameraEnabled(true).then(() => {
                            const videoTrack = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
                            if (videoTrack && videoTrack.videoTrack) {
                                videoTrack.videoTrack.attach(document.getElementById('video-background'));
                            }
                        });
                        console.log("[+] Моя камера опубликована");
                    } catch(camError) {
                        console.warn("[-] Камера занята или не найдена:", camError);
                        addMessageToTimeline("Система: Камера не обнаружена.", "ai");
                    }
                }

                addMessageToTimeline("Все системы синхронизированы. Слушаю вас.", "ai");

            } catch (error) {
                console.error("Критическая ошибка LiveKit:", error);
                alert("Ошибка WebRTC: " + error.message);
                leaveRoom();
            }
        }

        function leaveRoom() {
            // Отключаемся от облака, если были подключены
            if (room) {
                room.disconnect();
                room = null;
            }
            
            // Очищаем фон
            document.getElementById('video-background').srcObject = null;

            // Возвращаем UI
            document.getElementById('room-page').style.display = 'none';
            document.getElementById('lobby-page').style.display = 'flex';
            
            // Перезапускаем лобби
            countdown = 10;
            generateRandomName();
            startTimer();
        }

        // --- Логика Панели управления ---
        function toggleMic() {
            const btn = document.getElementById('btn-mic');
            if (!btn) return;
            btn.classList.toggle('active');
            // Если подключены к комнате — реально глушим/включаем микрофон в облаке
            if (room && room.localParticipant) {
                const enabled = btn.classList.contains('active');
                room.localParticipant.setMicrophoneEnabled(enabled);
            }
        }

        function requestTelemetry() {
            if (room && room.localParticipant) {
                const payload = JSON.stringify({ cmd: "get_telemetry" });
                const encoder = new TextEncoder();
                room.localParticipant.publishData(encoder.encode(payload), { reliable: true });
                addMessageToTimeline("Запрос телеметрии отправлен...", "human");
            } else {
                alert("Нет связи с сервером!");
            }
        }
        
        function toggleCam() {
            const btn = document.getElementById('btn-cam');
            if (!btn) return;
            btn.classList.toggle('active');
            // Если подключены к комнате — реально тушим/включаем камеру в облаке
            if (room && room.localParticipant) {
                const enabled = btn.classList.contains('active');
                room.localParticipant.setCameraEnabled(enabled);
            }
        }

        function takePhoto() {
            addMessageToTimeline("Запрошен снимок высокого разрешения...", "human");
            
            // Если чат закрыт - подсвечиваем кнопку
            const chat = document.getElementById('chat-overlay');
            if(chat.style.display !== 'flex') {
                document.getElementById('btn-chat').classList.add('notify');
            }

            // Отправляем реальную команду на Raspberry Pi
            if (room && room.localParticipant) {
                const payload = JSON.stringify({ cmd: "take_photo" });
                const encoder = new TextEncoder();
                room.localParticipant.publishData(encoder.encode(payload), { reliable: true });
            } else {
                alert("Нет связи с камерой!");
            }
        }

        const ZOOM_STEPS = [1.0, 1.5, 2.0, 3.0];
        let zoomIndex = 0; // Начинаем с 1.0 (индекс 0)
        let isZoomMode = false;
        
        // Вспомогательная функция заморозки кадра
        function freezeVideo() {
            const video = document.getElementById('video-background');
            const canvas = document.getElementById('freeze-frame');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.style.display = 'block';
            canvas.style.opacity = '1'; // Сбрасываем прозрачность
            return canvas;
        }
        
        function zoomIn() {
            const btn = document.getElementById('btn-zoom');
            
            zoomIndex = (zoomIndex + 1) % ZOOM_STEPS.length;
            let currentZoomLevel = ZOOM_STEPS[zoomIndex];
            
            btn.innerText = `[З] Зум ${currentZoomLevel}x`;

            if (currentZoomLevel === 1.0) {
                // === РЕЖИМ СБРОСА (ОТЪЕЗД НАЗАД) ===
                isZoomMode = false;
                document.getElementById('video-background').style.filter = "none";
                document.getElementById('video-background').style.cursor = "default";
                btn.classList.remove('active');
                
                // 1. Замораживаем текущий (приближенный) кадр
                const canvas = freezeVideo();
                // 2. Делаем цифровой отъезд назад
                canvas.style.transition = "transform 0.4s ease-out";
                canvas.style.transform = `scale(1.0)`;
                
                addMessageToTimeline("Оптика сброшена (Full View).", "ai");
                sendZoomCommand(0, 0, 1.0, 1.0);
            } else {
                // === РЕЖИМ ПРИЦЕЛИВАНИЯ ===
                isZoomMode = true;
                btn.classList.add('active');
                document.getElementById('video-background').style.filter = "grayscale(100%) brightness(0.4)";
                document.getElementById('video-background').style.cursor = "crosshair";
                addMessageToTimeline(`Прицел ${currentZoomLevel}x. Кликните по видео.`, "ai");
            }
        }
        // Обработчик клика по видео для вычисления точных координат
        document.getElementById('video-background').addEventListener('click', function(e) {
            if (!isZoomMode) return;

            const video = this;
            const rect = video.getBoundingClientRect();
            let currentZoomLevel = ZOOM_STEPS[zoomIndex];
            
            const elRatio = rect.width / rect.height;
            const vidRatio = video.videoWidth / video.videoHeight;
            let scale, xOffset = 0, yOffset = 0;
            
            if (elRatio > vidRatio) {
                scale = rect.width / video.videoWidth;
                yOffset = (rect.height - video.videoHeight * scale) / 2;
            } else {
                scale = rect.height / video.videoHeight;
                xOffset = (rect.width - video.videoWidth * scale) / 2;
            }
            
            const realX = (e.clientX - rect.left - xOffset) / scale;
            const realY = (e.clientY - rect.top - yOffset) / scale;
            
            let relativeX = realX / video.videoWidth;
            let relativeY = realY / video.videoHeight;

            video.style.filter = "none";
            video.style.cursor = "default";
            isZoomMode = false;
            
            let w = 1.0 / currentZoomLevel;
            let h = 1.0 / currentZoomLevel;
            let x = Math.max(0, Math.min(relativeX - w/2, 1 - w));
            let y = Math.max(0, Math.min(relativeY - h/2, 1 - h));
            
            addMessageToTimeline(`Наведение оптики...`, "human");
            sendZoomCommand(x, y, w, h);

            // 1. Замораживаем текущий (общий) кадр
            const canvas = freezeVideo();
            // 2. Делаем цифровой наезд в точку клика
            canvas.style.transition = "transform 0.4s ease-out";
            canvas.style.transformOrigin = `${relativeX * 100}% ${relativeY * 100}%`;
            canvas.style.transform = `scale(${currentZoomLevel})`;
        });

        // Отправка команды
        function sendZoomCommand(x, y, w, h) {
            if (room && room.localParticipant) {
                const payload = JSON.stringify({ cmd: "set_zoom", x: x, y: y, w: w, h: h });
                const encoder = new TextEncoder();
                room.localParticipant.publishData(encoder.encode(payload), { 
                    reliable: true,
                    destinationIdentities: ["nona-pi-camera"]
                });
            }
        }
        
        // --- Логика Чата ---
        function toggleChat() {
            const chat = document.getElementById('chat-overlay');
            const btn = document.getElementById('btn-chat');
            
            if (chat.style.display === 'flex') {
                chat.style.display = 'none';
            } else {
                chat.style.display = 'flex';
                // Как только мы открыли чат, убираем пульсацию с кнопки
                if (btn) btn.classList.remove('notify');
            }
        }

        function addMessageToTimeline(text, sender, imageUrl = null) {
            const timeline = document.getElementById('chat-timeline');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            
            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                div.appendChild(img);
            }
            
            timeline.appendChild(div);
            timeline.scrollTop = timeline.scrollHeight;
        }
    </script>
</body>
</html>
